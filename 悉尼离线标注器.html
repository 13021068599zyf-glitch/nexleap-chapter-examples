<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>悉尼离线标注器</title>
<style>
body{font:14px system-ui,"Microsoft YaHei";margin:0;background:#f6f8f5;color:#24362b}header{padding:16px;background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}main{display:grid;grid-template-columns:210px 1fr 270px;gap:15px;padding:15px}.box{background:white;border:1px solid #ddd;border-radius:9px;padding:14px;align-self:start}button,select,input,textarea{font:inherit;margin:4px;padding:7px}select,input,textarea{width:95%;box-sizing:border-box}textarea{height:90px}label{display:block;margin-top:12px;color:#657569}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:0;text-align:left;overflow:hidden}.card img{width:100%;aspect-ratio:4/3;object-fit:cover}.card span{display:block;padding:7px;font-size:11px}.hidden{display:none}.group{margin:18px 0}.group h3{border-top:1px solid #ddd;padding-top:12px}@media(max-width:900px){main{display:block}.box{margin-bottom:15px}.grid{grid-template-columns:repeat(2,1fr)}}
</style><body><header><h1>悉尼离线标注器</h1><button id="choose">选择完整数据文件夹</button><input id="folder" type="file" webkitdirectory multiple hidden><button id="import">载入标注 JSON</button><input id="json" type="file" accept=".json" hidden><button id="save" disabled>保存标注 JSON</button><span id="message">请选择分享包根目录</span></header>
<main><aside class="box"><h2>浏览</h2><label>Day</label><select id="day"></select><label>Chapter</label><select id="chapter"></select><label>抽帧偏移</label><select id="phase"></select><label>状态</label><select id="status"><option value="">全部状态</option><option>未处理</option><option>终选</option><option>候选</option><option>未选</option><option>排除</option></select><label>搜索</label><input id="query"><div id="chapterBox" class="hidden"><h3>Chapter 信息</h3><label>标题</label><input id="chapterTitle"><label>简介</label><textarea id="chapterIntro"></textarea><button id="saveChapter">保存 Chapter</button><h3>风貌组</h3><button id="newGroup">新建风貌组</button></div><p>结束前请导出标注 JSON。</p></aside>
<section class="box"><div><strong id="count">尚未载入</strong><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><div id="gallery"></div></section>
<aside class="box"><h2>图片标注</h2><p id="noImage">点击图片开始。</p><div id="editor" class="hidden"><img id="preview" style="width:100%"><p id="filename"></p><label>状态</label><select id="imageStatus"><option>未处理</option><option>终选</option><option>候选</option><option>未选</option><option>排除</option></select><label>标签</label><input id="tags"><label>备注</label><textarea id="note"></textarea><button id="saveImage">保存图片</button><h3>Chapter 归属</h3><select id="targetChapter"></select><button id="addChapter">加入 Chapter</button><div id="chapterImageActions" class="hidden"><button id="removeChapter">移出当前 Chapter</button><label>风貌组</label><select id="groupSelect"></select><button id="setGroup">保存风貌组</button><button id="setCover">设为本偏移组封面</button></div></div></aside></main><script>
"use strict";
const $=id=>document.getElementById(id);
let data=null,files=new Map(),urls=[],active=0,page=0,dirty=false;
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function phase(x){let s=x.filename.split("__phase_")[1];return s?Number(s.split("_")[0]):-1}
function img(id){return data.images.find(x=>x.image_id===Number(id))}
function chapter(){return data.chapters.find(x=>String(x.chapter_id)===$("chapter").value)}
function mark(){dirty=true;$("message").textContent="有未导出的修改，请保存标注 JSON"}
function options(){let oldDay=$("day").value,oldCh=$("chapter").value;$("day").innerHTML='<option value="">全部 Day</option>'+data.days.map(x=>'<option value="'+x.day_id+'">'+esc(x.title)+'</option>').join("");$("day").value=oldDay;$("chapter").innerHTML='<option value="">全部 Chapter</option>'+data.chapters.filter(x=>!oldDay||String(x.day_id)===oldDay).map(x=>'<option value="'+x.chapter_id+'">'+esc(x.title)+'</option>').join("");$("chapter").value=oldCh;$("targetChapter").innerHTML=data.chapters.map(x=>'<option value="'+x.chapter_id+'">'+esc(x.title)+'</option>').join("");$("phase").innerHTML='<option value="">全部偏移</option>'+Array.from({length:12},(_,i)=>'<option value="'+i+'">偏移 '+(i*10)+' 秒</option>').join("")}
function load(d){if(!Array.isArray(d.images)||!Array.isArray(d.chapters))throw Error("标注 JSON 格式不正确");data=d;data.groups||=[];data.group_images||=[];data.covers||=[];data.chapter_images||=[];page=0;active=0;dirty=false;$("save").disabled=false;options();render();$("message").textContent="已载入 "+data.images.length+" 张图片"}
function visible(){let day=$("day").value,ch=$("chapter").value,ph=$("phase").value,st=$("status").value,q=$("query").value.toLowerCase();let chIds=new Set(data.chapter_images.filter(x=>String(x.chapter_id)===ch).map(x=>x.image_id));let dayCh=new Set(data.chapters.filter(x=>String(x.day_id)===day).map(x=>x.chapter_id));let dayIds=new Set(data.chapter_images.filter(x=>dayCh.has(x.chapter_id)).map(x=>x.image_id));return data.images.filter(x=>(!day||dayIds.has(x.image_id))&&(!ch||chIds.has(x.image_id))&&(!ph||String(phase(x))===ph)&&(!st||x.status===st)&&(!q||(x.filename+" "+x.note+" "+x.tags_json).toLowerCase().includes(q)))}
function cards(items){return '<div class="grid">'+items.map(x=>'<button class="card" data-id="'+x.image_id+'"><img data-photo="'+x.image_id+'" alt="'+esc(x.filename)+'"><span>'+esc(x.time_label||"")+" · "+esc(x.status||"未处理")+'</span></button>').join("")+'</div>'}
function render(){if(!data)return;urls.forEach(u=>URL.revokeObjectURL(u));urls=[];let c=chapter();$("chapterBox").classList.toggle("hidden",!c);if(c){$("chapterTitle").value=c.title;$("chapterIntro").value=c.intro||""}let all=visible(),max=Math.max(1,Math.ceil(all.length/60));page=Math.min(page,max-1);let items=all.slice(page*60,(page+1)*60);$("count").textContent=all.length+" 张";$("page").textContent=(page+1)+" / "+max;$("prev").disabled=page===0;$("next").disabled=page>=max-1;let html="";if(c){let used=new Set();for(let g of data.groups.filter(x=>x.chapter_id===c.chapter_id).sort((a,b)=>a.position-b.position)){let ids=new Set(data.group_images.filter(x=>x.group_id===g.group_id).map(x=>x.image_id));let part=items.filter(x=>ids.has(x.image_id));part.forEach(x=>used.add(x.image_id));html+='<div class="group"><h3>'+esc(g.title)+'</h3><p>'+esc(g.description||"")+'</p>'+cards(part)+'</div>'}html+='<div class="group"><h3>未分组素材</h3>'+cards(items.filter(x=>!used.has(x.image_id)))+'</div>'}else html=cards(items);$("gallery").innerHTML=html;for(let el of $("gallery").querySelectorAll("[data-photo]")){let x=img(el.dataset.photo),f=files.get(x.rel_path);if(f){let u=URL.createObjectURL(f);urls.push(u);el.src=u}else el.alt="图片未载入，请选择完整目录"}if(active)editor(active)}
function editor(id){let x=img(id);if(!x)return;active=x.image_id;$("noImage").classList.add("hidden");$("editor").classList.remove("hidden");$("filename").textContent=x.filename;$("imageStatus").value=x.status||"未处理";try{$("tags").value=JSON.parse(x.tags_json||"[]").join("，")}catch{$("tags").value=""}$("note").value=x.note||"";let f=files.get(x.rel_path);$("preview").src=f?URL.createObjectURL(f):"";let c=chapter();$("chapterImageActions").classList.toggle("hidden",!c);if(c){let gs=data.groups.filter(g=>g.chapter_id===c.chapter_id);$("groupSelect").innerHTML='<option value="">未分组</option>'+gs.map(g=>'<option value="'+g.group_id+'">'+esc(g.title)+'</option>').join("");let idSet=new Set(gs.map(g=>g.group_id)),current=data.group_images.find(g=>g.image_id===x.image_id&&idSet.has(g.group_id));$("groupSelect").value=current?String(current.group_id):""}}
$("choose").onclick=()=>$("folder").click();$("import").onclick=()=>$("json").click();
$("folder").onchange=async e=>{files.clear();let jf=null;for(let f of e.target.files){let p=f.webkitRelativePath,i=p.indexOf("悉尼/");if(i>=0&&f.name.toLowerCase().endsWith(".jpg"))files.set(p.slice(i),f);if(f.name==="悉尼标注数据.json")jf=f}try{if(jf)load(JSON.parse(await jf.text()));else if(data)render();else throw Error("找不到悉尼标注数据.json，请选择整个分享包根目录");$("message").textContent="已连接 "+files.size+" 张图片"}catch(err){$("message").textContent=err.message}e.target.value=""};
$("json").onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){$("message").textContent=err.message}e.target.value=""};
$("save").onclick=()=>{if(!data)return;let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="悉尼标注数据.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);dirty=false;$("message").textContent="已下载 JSON，请用它替换分享包中的同名文件"};
$("day").onchange=()=>{page=0;$("chapter").value="";options();render()};$("chapter").onchange=()=>{page=0;render()};for(let id of ["phase","status","query"])$(id).oninput=()=>{page=0;render()};$("prev").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};
$("gallery").onclick=e=>{let card=e.target.closest("[data-id]");if(card)editor(card.dataset.id)};
$("saveImage").onclick=()=>{let x=img(active);if(!x)return;x.status=$("imageStatus").value;x.note=$("note").value.trim();x.tags_json=JSON.stringify($("tags").value.split(/[,，、;；]+/).map(s=>s.trim()).filter(Boolean));mark();render()};
$("saveChapter").onclick=()=>{let c=chapter();if(!c)return;c.title=$("chapterTitle").value.trim()||c.title;c.intro=$("chapterIntro").value.trim();mark();options();render()};
$("newGroup").onclick=()=>{let c=chapter();if(!c)return;let title=prompt("风貌组标题");if(!title?.trim())return;let id=Math.max(0,...data.groups.map(g=>g.group_id))+1;data.groups.push({group_id:id,chapter_id:c.chapter_id,title:title.trim(),description:prompt("共用描述")||"",position:data.groups.filter(g=>g.chapter_id===c.chapter_id).length+1});mark();render()};
$("addChapter").onclick=()=>{if(!active)return;let id=Number($("targetChapter").value);if(!id||data.chapter_images.some(x=>x.chapter_id===id&&x.image_id===active))return;data.chapter_images.push({chapter_id:id,image_id:active,position:data.chapter_images.filter(x=>x.chapter_id===id).length+1});mark();render()};
$("removeChapter").onclick=()=>{let c=chapter();if(!c||!active)return;data.chapter_images=data.chapter_images.filter(x=>x.chapter_id!==c.chapter_id||x.image_id!==active);let ids=new Set(data.groups.filter(g=>g.chapter_id===c.chapter_id).map(g=>g.group_id));data.group_images=data.group_images.filter(x=>x.image_id!==active||!ids.has(x.group_id));data.covers=data.covers.filter(x=>x.chapter_id!==c.chapter_id||x.image_id!==active);mark();render()};
$("setGroup").onclick=()=>{let c=chapter();if(!c||!active)return;let ids=new Set(data.groups.filter(g=>g.chapter_id===c.chapter_id).map(g=>g.group_id));data.group_images=data.group_images.filter(x=>x.image_id!==active||!ids.has(x.group_id));let id=Number($("groupSelect").value);if(id)data.group_images.push({group_id:id,image_id:active,position:data.group_images.filter(x=>x.group_id===id).length+1});mark();render()};
$("setCover").onclick=()=>{let c=chapter(),x=img(active);if(!c||!x)return;let p=phase(x);if(p<0)return;data.covers=data.covers.filter(y=>y.chapter_id!==c.chapter_id||y.phase!==p);data.covers.push({chapter_id:c.chapter_id,phase:p,image_id:x.image_id});mark();$("message").textContent="已设为本偏移组封面；结束前请保存标注 JSON"};
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
</script></body></html>
